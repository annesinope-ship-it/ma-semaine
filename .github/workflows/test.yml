name: Tester les widgets

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compiler
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Téléphone virtuel + test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appwidget grantbind --package com.annesophie.semaine --user 0
            adb logcat -c
            adb shell am instrument -w com.annesophie.semaine.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt 2>&1 || true
            cat instrument.txt
            adb logcat -d > logcat.txt || true
            mkdir -p shots
            adb pull /sdcard/Android/data/com.annesophie.semaine/files/shots shots/ || true
            ls -R shots

      - name: Rassembler
        if: always()
        run: |
          mkdir -p out
          cp instrument.txt out/ 2>/dev/null || true
          grep -iE "AndroidRuntime|AppWidget|RemoteViews|WidgetTest|semaine|FATAL|Exception" logcat.txt | head -400 > out/logcat-filtre.txt 2>/dev/null || true
          find shots -name "*.png" -exec cp {} out/ \; 2>/dev/null || true
          ls out

      - name: Publier les résultats
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tests-${{ github.run_number }}
          name: Tests ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: out/*
